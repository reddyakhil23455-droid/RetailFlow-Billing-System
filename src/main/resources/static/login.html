<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SuperBasket</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <a href="index.html"
           class="login-logo-link">

            <div class="login-logo">
                🛒
            </div>

        </a>


        <h1>
            Welcome Back
        </h1>

        <p class="login-subtitle">
            Sign in to manage your supermarket
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary full-btn">

                Login

            </button>

        </form>


        <div id="loginMessage"
             class="message">
        </div>


        <div class="register-divider">

            <span>Don't have an account?</span>

        </div>


        <a href="register.html"
           class="register-link">

            Create a new account

        </a>


        <a href="index.html"
           class="back-link">

            ← Back to Home

        </a>

    </div>

</div>


<script src="js/login.js"></script>

</body>

</html>
