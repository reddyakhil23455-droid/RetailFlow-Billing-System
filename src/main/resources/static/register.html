<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | SuperBasket</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <a href="index.html"
           class="login-logo-link">

            <div class="login-logo">
                🛒
            </div>

        </a>


        <h1>
            Create Account
        </h1>

        <p class="login-subtitle">
            Register to use SuperBasket
        </p>


        <form id="registerForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="50"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                id="registerButton"
                class="btn btn-primary full-btn">

                Create Account

            </button>


        </form>


        <div id="registerMessage"
             class="message">
        </div>


        <div class="register-divider">

            <span>
                Already have an account?
            </span>

        </div>


        <a href="login.html"
           class="register-link">

            Login to your account

        </a>


        <a href="index.html"
           class="back-link">

            ← Back to Home

        </a>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
